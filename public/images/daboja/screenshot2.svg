<svg width="300" height="600" viewBox="0 0 300 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dscr2" x1="0" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141417"/><stop offset="1" stop-color="#0b0b0e"/>
    </linearGradient>
    <linearGradient id="dg2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e7cd97"/><stop offset="1" stop-color="#c9a86a"/>
    </linearGradient>
    <linearGradient id="prod" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2a2f3a"/><stop offset="1" stop-color="#16191f"/></linearGradient>
  </defs>
  <rect width="300" height="600" fill="url(#dscr2)"/>
  <text x="22" y="34" fill="#ededf0" font-family="sans-serif" font-size="13" font-weight="600">9:41</text>
  <rect x="244" y="24" width="34" height="12" rx="3" stroke="#ededf0" stroke-opacity="0.5"/>
  <path d="M28 70l-8 8 8 8" stroke="#ededf0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="84" fill="#ededf0" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">가격 추이</text>
  <!-- product image -->
  <rect x="22" y="104" width="256" height="140" rx="16" fill="url(#prod)"/>
