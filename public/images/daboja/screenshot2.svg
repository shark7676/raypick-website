  <text x="22" y="282" fill="#ededf0" font-family="sans-serif" font-size="15" font-weight="700">무선 이어폰 Pro</text>
  <text x="22" y="308" fill="#8b909c" font-family="sans-serif" font-size="11">최근 30일 최저가</text>
  <text x="278" y="306" fill="#e7cd97" font-family="sans-serif" font-size="22" font-weight="800" text-anchor="end">89,000</text>
  <!-- price history chart -->
  <rect x="22" y="330" width="256" height="150" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- grid lines -->
  <line x1="40" y1="360" x2="262" y2="360" stroke="#ffffff" stroke-opacity="0.05"/>
  <line x1="40" y1="400" x2="262" y2="400" stroke="#ffffff" stroke-opacity="0.05"/>
  <line x1="40" y1="440" x2="262" y2="440" stroke="#ffffff" stroke-opacity="0.05"/>
  <!-- area + line -->
  <path d="M40 410 L80 388 L120 420 L160 372 L200 396 L240 350 L262 358 L262 460 L40 460 Z" fill="url(#dg2)" fill-opacity="0.12"/>
  <path d="M40 410 L80 388 L120 420 L160 372 L200 396 L240 350 L262 358" stroke="url(#dg2)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="240" cy="350" r="4" fill="#e7cd97"/>
  <circle cx="240" cy="350" r="8" fill="#e7cd97" fill-opacity="0.2"/>
  <!-- alert button -->
  <rect x="22" y="500" width="256" height="50" rx="14" fill="url(#dg2)"/>
  <text x="150" y="531" fill="#0b0b0e" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">최저가 알림 받기</text>
