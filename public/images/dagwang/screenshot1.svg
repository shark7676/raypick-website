  <text x="118" y="134" fill="#8b909c" font-family="sans-serif" font-size="11">제품</text>
  <text x="166" y="134" fill="#8b909c" font-family="sans-serif" font-size="11">행사</text>
  <text x="214" y="134" fill="#8b909c" font-family="sans-serif" font-size="11">직거래</text>
