<svg width="300" height="600" viewBox="0 0 300 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gscr" x1="0" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141417"/><stop offset="1" stop-color="#0b0b0e"/>
    </linearGradient>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e7cd97"/><stop offset="1" stop-color="#c9a86a"/>
    </linearGradient>
  </defs>
  <rect width="300" height="600" fill="url(#gscr)"/>
  <text x="22" y="34" fill="#ededf0" font-family="sans-serif" font-size="13" font-weight="600">9:41</text>
  <rect x="244" y="24" width="34" height="12" rx="3" stroke="#ededf0" stroke-opacity="0.5"/>
  <!-- header -->
  <text x="22" y="78" fill="#ededf0" font-family="sans-serif" font-size="24" font-weight="800">다광</text>
  <text x="22" y="98" fill="#8b909c" font-family="sans-serif" font-size="11">광고주 · 크리에이터 캠페인</text>
  <circle cx="270" cy="72" r="16" fill="#ffffff" fill-opacity="0.06"/>
  <circle cx="270" cy="72" r="6" stroke="url(#gg)" stroke-width="2"/>
